name: Test
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  spm-build:
    name: Swift Package build (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build

  xcodebuild-test:
    name: xcodebuild test, iOS Simulator (Xcode 16.2, macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'
      - name: Test
        run: |
          set -ex
          xcodebuild test -workspace KeychainAccess.xcworkspace -scheme KeychainAccess -destination 'platform=iOS Simulator,OS=18.2,name=iPhone 16 Pro' -only-testing:KeychainAccessTests -resultBundlePath TestResults.xcresult
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
